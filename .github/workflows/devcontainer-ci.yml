name: DevContainer CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Supply-chain baseline (homelab-governance, 2026-10-20): every action pinned to a full commit SHA with its tag as a
# comment, every tool by exact version, checkouts keep no token. The workflow grants nothing; each job asks for exactly
# what it needs.
permissions: {}
concurrency: { group: "devcontainer-${{ github.ref }}", cancel-in-progress: true } # a newer push supersedes a running check

jobs:
  devcontainer-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.37.2 # exact buildx (2026-09-30) instead of the latest

    - name: Install devcontainer CLI
      # a CLI by exact version (2026-08-31), with no lockfile to install from
      run: npm install -g @devcontainers/cli@0.89.0 # zizmor: ignore[adhoc-packages]

    - name: Build DevContainer
      run: |
        # `devcontainer build` only builds the image; lifecycle commands (postCreateCommand, ...) run on `up`, never
        # here. The CLI no longer accepts --skip-post-create (2026-10-20: "Unknown arguments: skip-post-create").
        devcontainer build --workspace-folder .

    - name: Test Docker Compose Build
      run: |
        docker compose build mcp-ascom

    - name: Run Container Tests
      run: |
        # Build test container
        docker compose build mcp-test
        
        # Run tests
        docker compose run --rm mcp-test || exit 1

  codespaces-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Validate devcontainer.json
      run: |
        # devcontainer.json is JSONC: whole-line // comments are removed before jq parses it. Any other comment form
        # still fails this check.
        if [ -f .devcontainer/devcontainer.json ]; then
          sed -E 's#^[[:space:]]*//.*$##' .devcontainer/devcontainer.json > "$RUNNER_TEMP/devcontainer.json"
          jq . "$RUNNER_TEMP/devcontainer.json" > /dev/null || exit 1
          echo "✅ devcontainer.json is valid"
        else
          echo "❌ devcontainer.json not found"
          exit 1
        fi

    - name: Check Codespaces requirements
      run: |
        # Verify required files exist
        [ -f .devcontainer/Dockerfile ] || echo "⚠️  Dockerfile not in .devcontainer"
        [ -f docker-compose.yml ] || echo "❌ docker-compose.yml missing"
        
        # Check hostRequirements in devcontainer.json
        jq -r '.hostRequirements' "$RUNNER_TEMP/devcontainer.json" || echo "⚠️  No hostRequirements specified"
        
    - name: Test MCP Server Import
      run: |
        docker run --rm \
          -v $PWD:/app \
          -w /app \
          python:3.12-slim \
          bash -c "pip install -e . && python -c 'import ascom_mcp; print(ascom_mcp.__version__)'"
